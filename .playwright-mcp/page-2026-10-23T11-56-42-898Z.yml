    - generic [ref=f57e263]:
      - heading "Words from our ambassadors" [level=2] [ref=f57e264]
      - paragraph [ref=f57e265]: Discover how ambassadors grow with us
    - list [ref=f57e266]:
      - listitem [ref=f57e267]:
        - paragraph [ref=f57e269]: What I love most is talking with students from different backgrounds and hearing how they found their university and their accommodation. Travelling for work and meeting new people along the way has helped me grow personally and professionally.
        - generic [ref=f57e271]:
          - generic [ref=f57e272]: Shivali Choyal
          - generic [ref=f57e273]: University of Strathclyde
      - listitem [ref=f57e274]:
        - paragraph [ref=f57e276]: My favourite part is doing property tours and helping students find a place that feels right for them. I went through the whole process of moving into student accommodation myself, so being able to share that and make the decision less overwhelming for someone else feels really good.
        - generic [ref=f57e278]:
          - generic [ref=f57e279]: Anshi Agarwala
          - generic [ref=f57e280]: Adelaide University
      - listitem [ref=f57e281]:
        - paragraph [ref=f57e283]: The work never feels repetitive — visiting properties, speaking to students, collecting reviews, and seeing it turn into paid opportunities alongside university. Staying on the ambassador leaderboard since I joined has been a highlight.
        - generic [ref=f57e285]:
          - generic [ref=f57e286]: Simran Panda
          - generic [ref=f57e287]: University of Birmingham
