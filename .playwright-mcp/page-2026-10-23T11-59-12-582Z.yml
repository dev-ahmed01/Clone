            - generic [ref=f75e422]: Catherine McHugh
            - generic [ref=f75e423]: Commercial Partnerships Manager, IDP Education
          - blockquote [ref=f75e424]:
            - paragraph [ref=f75e425]: “Over the past 12 months, IDP and Amber have built a strong partnership grounded in a shared commitment to helping students find a home away from home through a service that is trusted, responsive, secure and reliable.
            - paragraph [ref=f75e426]: What stands out most about our partnership is the depth of collaboration beyond student bookings. Together, we have strengthened collaboration through technology integration, operational alignment, and meaningful engagement with teams across our global market.
          - button "Read more" [ref=f75e427] [cursor=pointer]
        - article [ref=f75e428]:
          - generic [ref=f75e430]:
            - generic [ref=f75e431]: Chetan Jain
            - generic [ref=f75e432]: Managing Director, Study Smart
          - blockquote [ref=f75e433]:
            - paragraph [ref=f75e434]: “Our experience working with Amber Student has been excellent. Their team has consistently been professional, responsive, and supportive throughout our association. What really stands out is their student-first approach and their commitment to providing reliable accommodation solutions for students moving abroad.
            - paragraph [ref=f75e435]: Amber has been a valuable partner for us, helping make the accommodation journey smoother for our students and our team. We truly appreciate their seamless coordination, quick support, and understanding of the needs of international students. We look forward to continuing this successful partnership and creating even more value for students together.”
        - article [ref=f75e436]:
          - generic [ref=f75e438]:
            - generic [ref=f75e439]: Mayank Gupta
            - generic [ref=f75e440]: COO, Leap GeeBee
          - blockquote [ref=f75e441]:
            - paragraph [ref=f75e442]: "“Accommodation is where a student’s journey either settles or stays unsettled — and Amber has consistently gotten it right. Bookings are up nearly 80% this year, with the UK scaled at volume and Australia and Ireland turning around options faster than anyone else we work with. Beyond the numbers, they operate as true partners: quick to respond, quick to own escalations, transparent on commercials, and generous with data through their dashboard visibility. A special thanks to Prakhar and Brijesh, whose responsiveness anchors this relationship day to day. Most tellingly, very few complaints ever reach us — and that’s the only metric that matters. Glad to have Amber in the Leap GeeBee journey, and looking forward to scaling further.”"
