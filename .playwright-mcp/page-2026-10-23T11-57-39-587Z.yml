            - paragraph [ref=f69e162]: For PBSA operators and investors, mid-priced Studio and Ensuite options represent the core of Chinese demand.
            - heading [level=2] [ref=f69e163]:
              - strong [ref=f69e164]: What’s Next?
            - paragraph [ref=f69e165]: We expect the UK to retain its lead in attracting Chinese students but in terms of proportion rather than growth volumes. Demand is broadening well beyond China's elite institutions and decision-making is compressing into the post-results window. These will effectively shorten the period in which institutions can influence student choice and potentially shift conversion risk to the end of the cycle. Subject misalignment will remain a key vulnerability, with UK provision weighted towards courses that China has deliberately deprioritised, leaving exposure concentrated in particular disciplines. Hong Kong and onshore TNE, rather than the wider Asian market, will constitute the binding competitive constraint, since both compete for similar applicant cohorts on proximity, cost and credential value. In terms of accommodation, we anticipate demand consolidating in fewer cities, booking curves extending later and mid-priced Studios and Ensuite options underpinning Chinese absorption.
