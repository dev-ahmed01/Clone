    - generic [ref=f40e90]:
      - heading "14. Information given by you" [level=2] [ref=f40e91]
      - paragraph [ref=f40e92]: You can give us the information by filling the request form at Amber, over call, email or at various offline promotional events. The informational you give us may include your name, phone number, email id. For booking your accommodation at Amber you may need to give further personal information (ex. Birth date, country of origin, guarantor's details, University name etc) on call or email or other messaging services as necessary.
    - generic [ref=f40e93]:
      - heading "15. Consent to Personal Data Collection & Processing" [level=2] [ref=f40e94]
      - paragraph [ref=f40e95]: By using our services, you consent to the collection, processing, storage, and transfer of your personal data as described in our Privacy Policy. We process your information to provide and improve our services, communicate with you, and complete your accommodation bookings. We may share your data with trusted partners only as necessary for these purposes. You acknowledge that you have read and agree to our Privacy Policy and Terms of Use, and that you may withdraw consent or exercise your data rights at any time as permitted under applicable data-protection laws, including GDPR.
    - generic [ref=f40e96]:
      - heading "16. Service Fee - Refund Policy" [level=2] [ref=f40e97]
      - paragraph [ref=f40e98]: The Service Fee paid by the student at the time of initiating a booking request shall be strictly non-refundable under any and all circumstances, with the sole exception being a case where Amber is unable to secure the specific room category at the selected property as explicitly requested by the student during the time of booking. The non-refundable nature of the Service Fee shall apply irrespective of the reason for cancellation initiated by the student after the Service Fee has been remitted. This includes, but is not limited to, changes in travel plans, visa rejections, admission withdrawals, personal emergencies, or any other unforeseen or unavoidable circumstances that may arise. Amber invests significant resources and undertakes operational efforts upon receiving a booking request, including engaging with property partners, initiating reservation processes, and providing support services. Accordingly, the Service Fee is charged as a one-time commitment fee to cover these efforts and ensure priority handling of the student's booking. By proceeding with the payment of the Service Fee, the student expressly acknowledges and agrees to the terms of this refund policy and waives any claim for a refund except in the aforementioned case of non-availability of the requested room category.
