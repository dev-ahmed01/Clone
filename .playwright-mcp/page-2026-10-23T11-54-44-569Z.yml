    - generic [ref=f40e45]:
      - heading "5. Agreements between Users of Our Sites" [level=2] [ref=f40e46]
      - paragraph [ref=f40e47]: Our Sites allow property owners and managers to advertise their properties (each, an “Advertiser”) to potential student tenants (each, a “Student”).
      - paragraph [ref=f40e48]: You may use the Sites as a guest user or a registered user. Once you have discovered a property that best suits your needs, you can make an enquiry and complete the booking request form. The booking request form includes your name, email address, phone number and information concerning the length of stay. No payment details are required at this stage and there is no commitment to rent a room. Your allocated booking consultant will then contact you to confirm and discuss the accommodation type that you require. Contact may be made via email, call, whatsapp. We do not own or manage, nor do we contract for, any rental property listed on our Sites. We will not be a party to any agreement between an Advertiser and a Student. The terms of any agreement entered into between an Advertiser and a Student may vary from Advertiser to Advertiser. It is your responsibility to review and agree to an Advertiser's specific terms including the Advertiser's terms relating to payments and cancellations where payment is made via our Sites. All aspects of a transaction between a Student and an Advertiser, including (but not limited to) the quality, condition, safety or legality of the properties advertised and the ability of a user to enter into a transaction are solely the responsibility of each user. This includes the terms of any security deposit, which are set by the Advertiser. We do not represent, or negotiate, or carry out research on the part of or act on behalf of either Advertisers or Students.
      - paragraph [ref=f40e49]: We do not accept any responsibility for the confirmation of a Student and/or Advertiser's identity. Where a third party (for example an education or travel agent) acts on a Student's behalf, it is the Student's responsibility to ensure the accuracy of the information provided by the third party. We encourage users to take all such steps as necessary to communicate directly with a Student/Advertiser (as applicable) to assure yourself of the other person's identity, details of the property and any tenancy agreement.
      - paragraph [ref=f40e50]: By providing your contact information on our platform, you agree to allow Amber to contact you via email/call/sms for assistance, use your name to help others decide on the platform and also send you marketing/promotional content.
    - generic [ref=f40e51]:
      - heading "6. Prices" [level=2] [ref=f40e52]
      - paragraph [ref=f40e53]: The prices of properties displayed on the Sites are liable to change at any time. Despite our best efforts, some of the prices listed on the Sites may be incorrect. We expressly reserve the right to correct any pricing errors on our Sites and/or on potential bookings which have not yet been completed.
      - paragraph [ref=f40e54]: We display the prices that Advertisers provide to us from time to time. We are not responsible or liable for the accuracy of the prices displayed, to the maximum extent permitted by applicable law.
      - paragraph [ref=f40e55]: Due to the international nature of our Sites, the currency of the prices shown may vary depending on your location. Currency rates given on the Sites are based on various publicly available sources and should be used as guidelines only. Rates are not verified as accurate and actual prices may vary from those shown on the Sites.
      - paragraph [ref=f40e56]: From time to time, third parties may list promotions, special offers or other forms of coupon on our Sites (“Coupons”). Coupons will contain terms and conditions that will apply in addition to these Terms, and will be void if you attempt to redeem the Coupon in violation of either these Terms or the terms of the Coupon. Unless expressly stated on the Coupon, it may not be used in combination with other promotions or discounts. Coupons are only redeemable during the promotional period specified in the Coupon, subject to availability. These Coupons will be non-transferable and have no alternative cash value.
