    - generic [ref=f44e108]:
      - heading "8. Where We Save Your Data" [level=2] [ref=f44e109]
      - paragraph [ref=f44e110]: The data that we collect from you is processed by staff operating outside the EEA who work for us. Such staff maybe engaged in, among other things, the fulfilment of your accommodation booking. By submitting your personal data, you agree to this transfer, storing or processing. We will take all steps reasonably necessary to ensure that your data is treated securely and in accordance with this privacy policy.
      - paragraph [ref=f44e111]: All information you provide to us is stored on secure servers. where you have chosen a password which enables you to access certain parts of our site, you are responsible for keeping this password confidential. We ask you not to share a password with anyone.
      - paragraph [ref=f44e112]: Unfortunately, the transmission of information via the internet is not completely secure. Although we will do our best to protect your personal data, we cannot guarantee the security of your data transmitted to our site; any transmission is at your own risk. Once we have received your information, we will use strict procedures and security features to try to prevent unauthorised access.
