    - generic [ref=f44e72]:
      - heading "4. Cookies" [level=2] [ref=f44e73]
      - paragraph [ref=f44e74]: We use data collection device known as "cookies" at our website. "Cookies" are small files situated on Your mobile/ computer/ device's hard disk that assists Us in providing customised services. A cookie helps us analyse your preferences by, for example, recording the number of times you have used the Website, and help us in tailoring our services to suit your interests. We use various analytics tools and social media engagement tool which sets a cookie on your device. Data may be collected by social media companies that may enable them showing advertisements. A "cookie" does not give Us access to your device. You may choose to disable the "cookie" feature on Your device.
      - paragraph [ref=f44e75]: Using our online chat functionality may also mean that we collect information on your country and IP address. This information will not be used for any purpose other than to enhance the functionality the website.
    - generic [ref=f44e76]:
      - heading "5. Our Use of Your Information" [level=2] [ref=f44e77]
      - paragraph [ref=f44e78]: No mobile information will be shared with third parties/affiliates for marketing/promotional purposes. The information given by you shall be used to contact You when necessary. After your oral or written confirmation, information will be passed on to our third party accommodation partners or your university or relevant authorities for booking your Accommodation. Please read third party accommodation partner's privacy policy before giving oral or written confirmation
      - paragraph [ref=f44e79]: We can send you details about our services or blog posts and to notify about changes in service.
      - paragraph [ref=f44e80]: The information we collected from you can be used to improve our services, analytics, research, survey, advertisement and make suggestions to you and other users of the accommodations.
      - paragraph [ref=f44e81]: We may combine information given by other sources with information you give to us and information we collect about you. We may use information given by other sources and the combined information for the above purposes
